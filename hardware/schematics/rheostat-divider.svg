,-171 L 721.085,-171" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 699.4845726811989,-171.0 L 699.485,-196.2 L 699.485,-221.4" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 699.4845726811989,-221.4 L 760.956,-221.4 L 763.956,-230.4 L 769.956,-212.4 L 775.956,-230.4 L 781.956,-212.4 L 787.956,-230.4 L 793.956,-212.4 L 796.956,-221.4 L 858.427,-221.4" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 858.4268590217982,-221.4 L 858.427,-184.95 L 858.427,-148.5" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 844.0268590217983,-148.5 L 858.427,-148.5 L 872.827,-148.5" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 721.0845726811989,-126.0 L 715.685,-126 L 710.285,-126" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 710.2845726811988,-126.0 L 710.285,-115.2 L 710.285,-104.4" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 710.2845726811988,-104.39999999999999 L 710.285,-90 L 701.285,-90 L 719.285,-90 M 703.985,-85.68 L 716.585,-85.68 M 708.485,-81.36 L 712.085,-81.36" style="stroke:black;fill:none;stroke-width:1.2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="-32.4" y="-348.79999999999995" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="-32.4" dy="14">Pot divider ("the knob is the divider"):  V_P = 10 V · (D − d) / (40 − n)</tspan></text><text x="-18.0" y="-237.8" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="-18.0" dy="11">P1  danger played d</tspan><tspan x="-18.0" dy="11">(dial 0–40)</tspan></text><text x="41.76" y="-230.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="41.76" dy="11">V_d</tspan></text><text x="111.6" y="-239.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="111.6" dy="11">10k</tspan></text><text x="237.87114317029972" y="-204.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="237.87114317029972" dy="11">U1</tspan></text><text x="245.07114317029973" y="-290.0" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="245.07114317029973" dy="11">10k</tspan></text><text x="158.4" y="-185.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="158.4" dy="11">10k</tspan></text><text x="104.39999999999999" y="-169.4" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="104.39999999999999" dy="11">10k</tspan></text><text x="385.74228634059943" y="-259.41999999999996" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="385.74228634059943" dy="11">P2  cards played n</tspan><tspan x="385.74228634059943" dy="11">(rheostat: R = R₀·(40 − n)/40)</tspan></text><text x="519.2134295108992" y="-182.0" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="519.2134295108992" dy="11">U2</tspan></text><text x="526.4134295108993" y="-296.3" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="526.4134295108993" dy="11">R_f = R₀ (P2's full track)</tspan></text><text x="652.6845726811989" y="-194.6" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="652.6845726811989" dy="11">10k</tspan></text><text x="771.7557158514986" y="-159.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="771.7557158514986" dy="11">U3</tspan></text><text x="778.9557158514986" y="-245.0" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="778.9557158514986" dy="11">10k</tspan></text><text x="-32.4" y="11.200000000000003" dominant-baseline="ideographic" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="-32.4" dy="10">An inverting amplifier's gain is R_f / R_in. Make R_in the "cards played" pot, wired so its resistance is proportional to the</tspan><tspan x="-32.4" dy="10">cards LEFT, and the amplifier divides by cards left. With R_f equal to the full track R₀:</tspan><tspan x="-32.4" dy="10">      V_P = V_num · 40/(40 − n) = 10 V · (D − d)/(40 − n).</tspan><tspan x="-32.4" dy="10">V_P goes to the IN-13 driver. One quad op-amp (TL074) does all of it. Accuracy is the pots': their linearity and how precisely you set them (about ±1 card).</tspan><tspan x="-32.4" dy="10">A mechanical stop at n = 39 keeps R_in from reaching zero.</tspan></text><circle cx="-36" cy="-270" r="2.7" style="stroke:black;fill:white;stroke-width:1.2;stroke-dasharray:-;" /><text x="-42.300000000000004" y="-281.0" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="-42.300000000000004" dy="11">10 V ref</tspan></text><circle cx="165.6" cy="-216" r="2.7" style="stroke:black;fill:black;stroke-width:1.2;stroke-dasharray:-;" /><circle cx="158.4" cy="-171" r="2.7" style="stroke:black;fill:black;stroke-width:1.2;stroke-dasharray:-;" /><circle cx="50.4" cy="-113.4" r="2.7" style="stroke:black;fill:white;stroke-width:1.2;stroke-dasharray:-;" /><text x="50.4" y="-118.10000000000001" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="50.4" dy="11">V_D from detectors</tspan><tspan x="50.4" dy="11">(0.25 V per card)</tspan></text><circle cx="324.542" cy="-193.5" r="2.7" style="stroke:black;fill:black;stroke-width:1.2;stroke-dasharray:-;" /><text x="324.5422863405995" y="-198.20000000000002" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="324.5422863405995" dy="11">V_num</tspan></text><circle cx="446.942" cy="-193.5" r="2.7" style="stroke:black;fill:black;stroke-width:1.2;stroke-dasharray:-;" /><circle cx="605.885" cy="-171" r="2.7" style="stroke:black;fill:black;stroke-width:1.2;stroke-dasharray:-;" /><text x="605.8845726811988" y="-175.70000000000002" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="605.8845726811988" dy="11">−V_P</tspan></text><circle cx="699.485" cy="-171" r="2.7" style="stroke:black;fill:black;stroke-width:1.2;stroke-dasharray:-;" /><circle cx="872.827" cy="-148.5" r="2.7" style="stroke:black;fill:white;stroke-width:1.2;stroke-dasharray:-;" /><text x="879.1268590217983" y="-159.5" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="879.1268590217983" dy="11">V_P</tspan></text></svg>
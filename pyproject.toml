[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-blaster-decode"
version = "0.0.1"
description = "Decode USB-captured Altera USB Blaster traffic into JTAG IR/DR shifts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
usb-blaster-decode = "usb_blaster_decode.cli:main"
aji-probe = "aji_pyclient.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
